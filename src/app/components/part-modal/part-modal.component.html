<div class="modal-overlay" (click)="closeModal()" (keydown.enter)="closeModal()" (keydown.escape)="closeModal()">
  <div class="modal-container" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
    <!-- Modern Header -->
    <div class="modal-header">
      <div class="header-left">
        <div class="part-icon">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M12 2L2 7v10c0 5.55 3.84 10 9 9 5.16 1 9-3.45 9-9V7l-10-5z"></path>
          </svg>
        </div>
        <div class="header-info">
          <h1>{{ partData.material || partData.materialDescription || 'N/A' }}</h1>
        </div>
      </div>
      <button class="close-button" (click)="closeModal()" aria-label="Close">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Modal Content -->
    <div class="modal-content">
      <!-- BOM Instances Table -->
      <div class="key-value-table-card" *ngIf="hasInstances()">
        <div class="card-header">
          <h3>Material Details</h3>
        </div>
        <div class="table-container">
          <table class="key-value-table">
            <thead>
              <tr>
                <th *ngFor="let key of getColumnKeys()" [attr.data-column]="key">
                  {{ getColumns()[key] }}
                </th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let instance of getInstances()">
                <td *ngFor="let key of getColumnKeys()" class="value-cell" [attr.data-column]="key">
                  {{ instance[bomLinkKey][key] }}
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Empty Instances State - Show centered message when instances array exists but is empty -->
      <div *ngIf="!hasInstances() && partData?.instances" class="empty-state empty-instances-state">
        <div class="empty-icon">
          <svg
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="M9 12l2 2 4-4"></path>
            <circle cx="12" cy="12" r="9"></circle>
          </svg>
        </div>
        <h4>No Material BOM lineitems found for the material</h4>
      </div>

      <!-- SKU Portfolio section removed as per requirement to follow API columns -->
    </div>
  </div>
</div>
