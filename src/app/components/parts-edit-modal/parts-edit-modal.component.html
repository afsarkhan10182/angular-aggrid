<div class="modal-overlay" tabindex="0" aria-label="Modal overlay">
  <div class="modal-container" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Service - DataManager</h3>
      <button (click)="handleCloseClick()" class="close-btn" title="Close">
        <app-icon name="times" size="16"></app-icon>
      </button>
    </div>
    <div class="modal-body">
      <!-- Mass Edit Button -->
      <div class="mass-edit-button-container">
        <button
          (click)="massEditMode ? closeMassEditMode() : openMassEdit()"
          class="mass-edit-toggle-btn"
          [class.active]="massEditMode"
          [title]="massEditMode ? 'Close Mass Edit' : 'Enable Mass Edit for all rows'"
        >
          <app-icon name="edit" size="14"></app-icon> {{ massEditMode ? 'Close Mass Edit' : 'Mass Edit' }}
        </button>
      </div>

      <!-- Mass Edit Header Row - FlexPLM Style (shows above grid headers) -->
      <div *ngIf="massEditMode" class="mass-edit-header-row" #massEditHeaderRow>
        <div class="mass-edit-header-row-content" #massEditHeaderContent>
          <div *ngFor="let field of getEditableFields()" class="mass-edit-header-cell" [style.width.px]="getColumnWidth(field)">
            <div class="mass-edit-field-wrapper">
              <label class="mass-edit-field-label">{{ getColumnHeaderName(field) }}</label>
              <!-- Autocomplete input for service search -->
              <div class="mass-edit-autocomplete-container">
                <input
                  type="text"
                  [(ngModel)]="massEditValues[field]"
                  (input)="onMassEditInputChange(field, $any($event.target).value, $event)"
                  (focus)="onMassEditInputFocus(field, $event)"
                  (keydown)="onMassEditInputKeyDown(field, $event)"
                  (blur)="closeMassEditDropdown(field)"
                  class="mass-edit-header-input"
                  [placeholder]="'Search ' + getColumnHeaderName(field)"
                  autocomplete="off"
                />
                <!-- Autocomplete dropdown -->
                <div
                  *ngIf="getMassEditAutocomplete(field).showDropdown && getMassEditAutocomplete(field).options.length > 0"
                  class="mass-edit-autocomplete-dropdown"
                  [style.top]="getMassEditAutocomplete(field).top"
                  [style.left]="getMassEditAutocomplete(field).left"
                  [style.width]="getMassEditAutocomplete(field).width"
                  (click)="$event.stopPropagation()"
                >
                  <div class="dropdown-header">
                    Select service ({{ getMassEditAutocomplete(field).options.length }} available)
                  </div>
                  <div
                    *ngFor="let option of getMassEditAutocomplete(field).options; let i = index"
                    [class.selected]="i === getMassEditAutocomplete(field).selectedIndex"
                    class="dropdown-option"
                    (click)="selectMassEditOption(field, option); $event.stopPropagation()"
                    (mouseenter)="getMassEditAutocomplete(field).selectedIndex = i"
                  >
                    {{ option }}
                  </div>
                </div>
              </div>
            </div>
          </div>
          <!-- Apply button inline with fields -->
          <div class="mass-edit-apply-cell">
            <button
              (click)="applyMassEdit()"
              class="apply-mass-edit-btn"
              [disabled]="isMassEditing"
              title="Apply mass edit to all rows"
            >
              <app-icon *ngIf="!isMassEditing" name="check" size="14"></app-icon>
              <app-icon *ngIf="isMassEditing" name="spinner" size="14"></app-icon>
              <span *ngIf="!isMassEditing">Apply</span>
              <span *ngIf="isMassEditing">Applying...</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Success Message -->
      <div *ngIf="showSuccessMessage" class="success-panel">
        <div class="success-content">
          <span class="success-icon">✓</span>
          <span class="success-text">{{ successMessage }}</span>
          <button (click)="showSuccessMessage = false" class="close-success-btn" title="Dismiss">
            ×
          </button>
        </div>
      </div>

      <!-- Error Messages Panel -->
      <div *ngIf="hasErrors()" class="error-panel">
        <div class="error-panel-header">
          <div class="error-header-left">
            <span class="error-icon">⚠</span>
            <span class="error-header-text">Errors ({{ getErrorEntries().length }})</span>
          </div>
          <button (click)="clearAllErrors()" class="close-error-panel-btn" title="Dismiss all errors">
            ×
          </button>
        </div>
        <div class="error-list">
          <div *ngFor="let errorEntry of getErrorEntries()" class="error-item">
            <div class="error-row-info">
              <strong>Part # {{ getPartNumberForError(errorEntry.materialColorId) }}:</strong>
            </div>
            <div class="error-message">{{ errorEntry.message }}</div>
          </div>
        </div>
      </div>

      <div class="modal-grid-container" #modalGridContainer>
        <ag-grid-angular
          [style.width]="'100%'"
          [style.height]="'100%'"
          class="ag-theme-alpine"
          [gridOptions]="gridOptions"
          [columnDefs]="columnDefs"
          [defaultColDef]="defaultColDef"
          [rowData]="rowData"
        ></ag-grid-angular>
      </div>
    </div>
    <div class="modal-footer">
      <button (click)="handleCloseClick()" class="cancel-btn">Cancel</button>
      <button (click)="saveModal()" class="save-btn" [disabled]="!hasEditedRows" [title]="hasEditedRows ? 'Save changes' : 'No changes to save'">
        <app-icon name="save" size="14"></app-icon> Save
      </button>
    </div>
  </div>
</div>
