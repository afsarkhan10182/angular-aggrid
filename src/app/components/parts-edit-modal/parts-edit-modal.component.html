<div class="modal-overlay" tabindex="0" aria-label="Modal overlay">
  <div class="modal-container" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Service - DataManager</h3>
      <button (click)="handleCloseClick()" class="close-btn" title="Close">
        <app-icon name="times" size="16"></app-icon>
      </button>
    </div>
    <div class="modal-body">
      <!-- Mass Edit Button positioned above checkbox -->
      <div class="mass-edit-button-container">
        <button
          (click)="openMassEdit()"
          class="mass-edit-toggle-btn"
          [class.disabled]="getSelectedRowsCount() <= 1"
          [disabled]="getSelectedRowsCount() <= 1 || massEditMode"
          [title]="
            getSelectedRowsCount() <= 1
              ? 'Select more than 1 row to enable Mass Edit'
              : 'Mass Edit Selected Rows'
          "
        >
          <app-icon name="edit" size="14"></app-icon> Mass Edit
        </button>
      </div>

      <!-- Mass Edit Panel -->
      <div *ngIf="massEditMode && getSelectedRowsCount() > 1" class="mass-edit-panel">
        <div class="mass-edit-header">
          <h4>Mass Edit ({{ getSelectedRowsCount() }} rows selected)</h4>
          <button (click)="closeMassEditMode()" class="close-mass-edit-btn" title="Close">
            <span class="close-icon">×</span>
          </button>
        </div>
        <div class="mass-edit-fields">
          <div class="mass-edit-field">
            <label for="mass-edit-service-description">Service Description:</label>
            <input
              id="mass-edit-service-description"
              type="text"
              [(ngModel)]="massEditServiceDescription"
              class="mass-edit-input"
              placeholder="Enter service description"
            />
          </div>
          <div class="mass-edit-field">
            <label for="mass-edit-service-message">Service Message:</label>
            <input
              id="mass-edit-service-message"
              type="text"
              [(ngModel)]="massEditServiceMessage"
              class="mass-edit-input"
              placeholder="Enter service message"
            />
          </div>
          <div class="mass-edit-actions">
            <button (click)="applyMassEdit()" class="apply-mass-edit-btn" [disabled]="isMassEditing">
              <app-icon *ngIf="!isMassEditing" name="check" size="14"></app-icon>
              <app-icon *ngIf="isMassEditing" name="spinner" size="14"></app-icon>
              <span *ngIf="!isMassEditing">Apply</span>
              <span *ngIf="isMassEditing">Applying...</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Success Message -->
      <div *ngIf="showSuccessMessage" class="success-panel">
        <div class="success-content">
          <span class="success-icon">✓</span>
          <span class="success-text">{{ successMessage }}</span>
          <button (click)="showSuccessMessage = false" class="close-success-btn" title="Dismiss">
            ×
          </button>
        </div>
      </div>

      <!-- Error Messages Panel -->
      <div *ngIf="hasErrors()" class="error-panel">
        <div class="error-panel-header">
          <div class="error-header-left">
            <span class="error-icon">⚠</span>
            <span class="error-header-text">Errors ({{ getErrorEntries().length }})</span>
          </div>
          <button (click)="clearAllErrors()" class="close-error-panel-btn" title="Dismiss all errors">
            ×
          </button>
        </div>
        <div class="error-list">
          <div *ngFor="let errorEntry of getErrorEntries()" class="error-item">
            <div class="error-row-info">
              <strong>Part # {{ getPartNumberForError(errorEntry.materialColorId) }}:</strong>
            </div>
            <div class="error-message">{{ errorEntry.message }}</div>
          </div>
        </div>
      </div>

      <div class="modal-grid-container">
        <ag-grid-angular
          [style.width]="'100%'"
          [style.height]="hasErrors() ? (massEditMode ? '400px' : '350px') : (massEditMode ? '345px' : '400px')"
          class="ag-theme-alpine"
          [gridOptions]="gridOptions"
          [columnDefs]="columnDefs"
          [defaultColDef]="defaultColDef"
          [rowData]="rowData"
        ></ag-grid-angular>
      </div>
    </div>
    <div class="modal-footer">
      <button (click)="handleCloseClick()" class="cancel-btn">Cancel</button>
      <button (click)="saveModal()" class="save-btn" [disabled]="!hasEditedRows" [title]="hasEditedRows ? 'Save changes' : 'No changes to save'">
        <app-icon name="save" size="14"></app-icon> Save
      </button>
    </div>
  </div>
</div>
