<section class="coo-analysis-section" [class.coo-analysis-section-modal]="isModal" aria-label="COO Analysis">
  <div *ngIf="isLoading" class="loading-spinner-container">
    <div class="loading-spinner">
      <div class="spinner"></div>
      <p>Loading data...</p>
    </div>
  </div>

  <div class="coo-analysis-toolbar">
    <label class="coo-analysis-toolbar-item coo-analysis-rule">
      <strong>BOM Rule</strong>
      <div class="coo-analysis-select-wrapper">
        <select
          class="coo-analysis-select"
          [(ngModel)]="selectedBomRule"
          (change)="onFilterChange()"
          aria-label="COO Analysis BOM Rule"
        >
          <option *ngFor="let rule of bomRuleOptions" [value]="cooAnalysisService.getOptionValue(rule)">
            {{ cooAnalysisService.getOptionLabel(rule) }}
          </option>
        </select>
        <app-icon name="chevron-down" size="14" class="coo-analysis-select-arrow"></app-icon>
      </div>
    </label>

    <label class="coo-analysis-toolbar-item">
      <strong>COO</strong>
      <div class="coo-analysis-select-wrapper coo-analysis-country-wrapper">
        <select
          class="coo-analysis-select"
          [(ngModel)]="selectedCoo"
          (change)="onFilterChange()"
          aria-label="COO Analysis country"
        >
          <option *ngFor="let country of cooOptions" [value]="cooAnalysisService.getOptionValue(country)">
            {{ cooAnalysisService.getOptionLabel(country) }}
          </option>
        </select>
        <app-icon name="chevron-down" size="14" class="coo-analysis-select-arrow"></app-icon>
      </div>
    </label>

    <label class="coo-analysis-toolbar-item coo-analysis-date-field">
      <strong>As Of</strong>
      <input
        type="date"
        class="coo-analysis-date-input"
        [(ngModel)]="asOfDate"
        (click)="openDatePicker($event)"
        (focus)="openDatePicker($event)"
        (change)="onFilterChange()"
        aria-label="COO Analysis As Of date"
      />
    </label>
  </div>

  <div
    *ngIf="exportMessage"
    class="save-message coo-analysis-save-message"
    [class.success]="exportMessageType === 'success'"
    [class.error]="exportMessageType === 'error'"
    [class.info]="exportMessageType === 'info'"
  >
    <span class="save-message-text">{{ exportMessage }}</span>
    <button (click)="clearExportMessage()" class="save-message-close" title="Close">
      <span class="close-icon-text">×</span>
    </button>
  </div>

  <div class="coo-analysis-grid-wrap">
    <ag-grid-angular
      style="width: 100%"
      class="ag-theme-alpine coo-analysis-grid"
      [domLayout]="isModal ? 'normal' : 'autoHeight'"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [rowData]="rows"
      [context]="gridContext"
    >
    </ag-grid-angular>
  </div>
</section>
