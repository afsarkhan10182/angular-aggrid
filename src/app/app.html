<div class="app-container" [class.mass-edit-active]="massEditMode || hasDisconnectedSkusPanelVisible">
  <!-- Header -->
  <div class="app-header">
    <div class="header-left">
      <div class="criteria-display">
        <strong>{{ getCriteriaLabel() }}</strong>
        <span [title]="bomNamesFull">{{ bomNamesDisplay }}</span>
      </div>
    </div>
    <h2>
      <span>{{ getBomComposerTitle() }}</span>
    </h2>
    <div class="header-right">
      <!-- User info display -->
      <div class="user-info" *ngIf="currentUser">
        <app-icon name="user" size="16"></app-icon>
        <span class="username">{{ currentUser.fullName || currentUser.name }}</span>
      </div>
    </div>
  </div>

  <!-- Controls Section -->
  <div class="controls-section">
    <!-- Criteria Display and Controls -->
    <div class="controls-row">
      <!-- Left Group: Criteria and Search -->
      <div class="left-controls-group">
        <div class="search-filter-section">
          <div class="search-filter-container">
            <div class="search-input-wrapper">
              <input
                type="text"
                class="search-input"
                placeholder="Search All Columns"
                [(ngModel)]="searchText"
                (input)="onSearchTextChange()"
                (keyup.enter)="applyGridSearch()"
                #searchInput
              />
              <button
                *ngIf="searchText"
                class="clear-search-btn"
                (click)="clearSearch()"
                title="Clear search"
              >
                <app-icon name="times" size="14"></app-icon>
              </button>
            </div>
            <button
              class="search-filter-btn"
              (click)="applyGridSearch()"
              [disabled]="!searchText"
              title="Search"
            >
              <app-icon name="search" size="14"></app-icon>
            </button>
          </div>
        </div>
      </div>

      <!-- Right Group: Show Expired, Last Saved, Export, and Save -->
      <div class="right-controls-group">
        <div class="toggle-switch-container" *ngIf="shouldShowExpiredToggle()">
          <label class="toggle-switch">
            <span class="toggle-text">Show Expired:</span>
            <input
              type="checkbox"
              id="show-expired-toggle"
              [(ngModel)]="showExpiredData"
              (change)="toggleExpiredData()"
            />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="save-section">
          <!-- Last Saved Display -->
          <div class="last-saved-display">
            <app-icon name="clock" size="14"></app-icon>
            <span class="last-saved-text">
              {{ getLastSavedText() }}
            </span>
          </div>
          <!-- Save Changes Button -->
          <button
            (click)="saveChanges()"
            class="save-changes-btn"
            [disabled]="editedRows.size === 0 || isSaving || isSkuFilterReadOnly()"
            [title]="getSaveButtonTooltip()"
          >
            <ng-container *ngIf="!isSaving; else savingTpl">
              <app-icon name="save" size="14"></app-icon>
              <span>Save</span>
            </ng-container>
            <ng-template #savingTpl>
              <span class="btn-inline-spinner" aria-hidden="true"></span>
              <span>Saving</span>
            </ng-template>
          </button>
        </div>
      </div>
    </div>

    <!-- Save Status Message -->
    <div *ngIf="saveMessage" class="save-message" [class]="saveMessageType">
      <span class="save-message-text">{{ saveMessage }}</span>
      <button (click)="clearSaveMessage()" class="save-message-close" title="Close">
        <span class="close-icon-text">×</span>
      </button>
    </div>

    <!-- AG Grid with Toggle Button Container -->
    <div class="ag-grid-section">
      <!-- Loading Spinner -->
      <div *ngIf="isLoading" class="loading-spinner-container">
        <div class="loading-spinner">
          <div class="spinner"></div>
          <p>Loading data...</p>
        </div>
      </div>

      <!-- AG Grid Container -->
      <div class="ag-grid-container-wrapper" [class.loading]="isLoading">
        <div class="ag-grid-container">
          <ag-grid-angular
            style="width: 100%"
            [style.height]="gridViewportHeight"
            class="ag-theme-alpine"
            [gridOptions]="gridOptions"
            [columnDefs]="columnDefs"
            [defaultColDef]="defaultColDef"
            [rowData]="displayData"
            (gridReady)="onGridReady($event)"
            (cellClicked)="onCellClicked($event)"
            (selectionChanged)="onSelectionChanged($event)"
          >
          </ag-grid-angular>
        </div>
      </div>

    </div>
  </div>

  <!-- Linked BOM Modal -->
  @if (showLinkedBomModal) {
    @defer (when showLinkedBomModal) {
      <app-linked-bom-modal
        [partData]="selectedLinkedBomData"
        [skuData]="selectedLinkedBomSkuData"
        [isLoading]="isLinkedBomLoading"
        (modalClose)="closeLinkedBomModal()"
      >
      </app-linked-bom-modal>
    } @loading {
      <div class="modal-overlay" (click)="closeLinkedBomModal()">
        <div class="modal-container app-modal-shell modal-shell" (click)="$event.stopPropagation()">
          <div class="modal-header app-modal-header">
            <h3>Linked BOM</h3>
            <button class="close-button app-modal-close" (click)="closeLinkedBomModal()" aria-label="Close">
              <app-icon name="times" size="14"></app-icon>
            </button>
          </div>
          <div class="modal-content app-modal-body">
            <div class="modal-loading-state">
              <div class="modal-loader" aria-hidden="true"></div>
              <p class="modal-loading-text">Opening linked BOM...</p>
            </div>
          </div>
        </div>
      </div>
    }
  }

</div>
