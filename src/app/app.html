<!-- Main Grid View - Show when not on part detail route -->
<div class="app-container">
  <!-- Header -->
  <div class="app-header">
    <h2>MBOM</h2>
  </div>

  <!-- Controls Section -->
  <div class="controls-section">
    <!-- Criteria Display and Controls -->
    <div class="controls-row">
      <div class="criteria-display">
        <strong>Criteria:</strong> Parts of SKUs chosen - {{ dataService.getProductInfo()?.productId || '100690' }}
      </div>
      <div class="toggle-switch-container">
        <span class="toggle-text">Show Expired:</span>
        <span class="expired-count" *ngIf="showExpiredData && expiredDataCount > 0">{{ expiredDataCount }}</span>
        <label class="toggle-switch">
          <input type="checkbox" [(ngModel)]="showExpiredData" (change)="toggleExpiredData()">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="save-section">
        <!-- Last Saved Display -->
        <div class="last-saved-display">
          <i class="fas fa-clock"></i>
          <span class="last-saved-text">
            {{ lastSavedAt ? 'Last Saved: ' + formatLastSavedTime(lastSavedAt) : 'No saves yet' }}
          </span>
        </div>
        <!-- Save Changes Button -->
        <button 
          (click)="saveChanges()" 
          class="save-changes-btn"
          [disabled]="editedRows.size === 0">
          <i class="fas fa-save"></i> Save ({{ editedRows.size }})
        </button>
      </div>
    </div>
    
    <!-- Save Status Message -->
    <div *ngIf="saveMessage" class="save-message" [class]="saveMessageType">
      <span class="save-message-text">{{ saveMessage }}</span>
      <button (click)="clearSaveMessage()" class="save-message-close">
        <i class="fas fa-times"></i>
      </button>
    </div>
    
  <!-- AG Grid with Toggle Button Container -->
  <div class="ag-grid-section">
    <!-- AG Grid Container -->
    <div class="ag-grid-container-wrapper">
      <div class="ag-grid-container">
        <ag-grid-angular 
          style="width: 100%; height: 700px; min-width: 100%;" 
          class="ag-theme-alpine"
          [gridOptions]="gridOptions"
          [columnDefs]="columnDefs" 
          [defaultColDef]="defaultColDef" 
          [rowData]="rowData"
          (gridReady)="onGridReady($event)"
          (cellClicked)="onCellClicked($event)">
        </ag-grid-angular>
      </div>
    </div>
    
    <!-- Toggle Columns Button - Outside grid but visually integrated -->
    <div class="grid-toggle-button-container" [class.panel-open]="showColumnVisibilityPanel">
      <button (click)="toggleColumnVisibility()" class="grid-toggle-columns-btn" title="Show/Hide Columns">
        <div class="toggle-button-content">
          <i class="fas fa-columns"></i>
          <span class="toggle-button-text">TOGGLE COLUMNS</span>
        </div>
      </button>
    </div>
    
    <!-- Column Visibility Panel - Positioned near grid toggle button -->
    <div *ngIf="showColumnVisibilityPanel" class="grid-column-visibility-panel-container">
      <div class="column-visibility-panel" (click)="$event.stopPropagation()">
        <div class="column-visibility-header">
          <h4>Visible Columns</h4>
          <button (click)="showColumnVisibilityPanel = false" class="close-panel-btn">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="column-checkboxes">
          <ng-container *ngFor="let col of columnDefs">
            <div *ngIf="!isSkuColumn(col)" class="column-checkbox">
              <label>
                <input type="checkbox" 
                       [checked]="!col.hide" 
                       (change)="toggleColumnVisibility(col, $event)">
                <span class="column-name">{{ getColumnDisplayName(col) }}</span>
              </label>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Part Detail Modal -->
<app-part-modal 
  *ngIf="showPartModal"
  [partData]="selectedPartData"
  [skuData]="selectedPartSkuData"
  (close)="closePartModal()">
</app-part-modal>
